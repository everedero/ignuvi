# FT2232 channel A as an SWD probe with the "resistor hack":
#   ADBUS0 TCK -> SWCLK (TP3, PA30)
#   ADBUS1 TDI -> 470 ohm -> SWDIO (TP2, PA31)
#   ADBUS2 TDO -> SWDIO, direct
#   GND -> GND
# No nSRST: RESETn belongs to STM32 PB0 (hogged high in ignuvi.dts).
# Channel B (BDBUS0 TX, BDBUS1 RX) stays a UART for the console.
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
# TCK, TDI, TMS outputs; TDO input
ftdi layout_init 0x0000 0x000b
source [find interface/ftdi/swd-resistor-hack.cfg]
# Raise once stable (FT2232D: 6 MHz max)
adapter speed 1000

set CHIPNAME at91samr21e18a
source [find target/at91samdXX.cfg]
reset_config none

$_TARGETNAME configure -event gdb-attach {
	echo "Debugger attaching: halting execution"
	reset halt
	gdb_breakpoint_override hard
}

$_TARGETNAME configure -event gdb-detach {
	echo "Debugger detaching: resuming execution"
	resume
}
