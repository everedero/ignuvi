CONFIG_GPIO=y
CONFIG_LOG=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
# A peer that lost its bond can pair again, still only inside the window
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_BT_MAX_PAIRED=4
# Outside pairing mode only bonded peers connect. GAP limited discoverable: 180 s max
CONFIG_BT_FILTER_ACCEPT_LIST=y
CONFIG_BT_LIM_ADV_TIMEOUT=180
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_BT_DEVICE_NAME="Ignuvi"
# settings_load() and settings_save_one() from the GATT write handler
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_BT_RX_STACK_SIZE=2048

CONFIG_BT_DIS=y
CONFIG_BT_DIS_MANUF_NAME_STR="vendor"
CONFIG_BT_DIS_MODEL_NUMBER_STR="Ignuvi"
CONFIG_BT_DIS_PNP=n
