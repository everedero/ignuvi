# Mains test: Zephyr shell and logs over BLE (Nordic UART Service), plus the
# TP1/TP3 ADC diagnostics. Probe and USART1 must stay unplugged on mains.
# Build with -DEXTRA_CONF_FILE=overlay-test.conf -DEXTRA_DTC_OVERLAY_FILE=test.overlay
CONFIG_BT_ZEPHYR_NUS=y
CONFIG_UART_BT=y
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=3072
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_ADC=y

# One ATT notification per shell line or so
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251

# Logs reach BLE from the log thread, never inline in the caller (ISRs,
# Bluetooth callbacks); the shell drains NUS from interrupts, not polling
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_SHELL_BACKEND_SERIAL_API_INTERRUPT_DRIVEN=y
# uart_nus warns when its buffer fills, and the warning goes to that buffer
CONFIG_UART_LOG_LEVEL_ERR=y
