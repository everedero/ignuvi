# AT86RF233 bring-up: "ieee802154 scan active all 300" from the shell
CONFIG_NETWORKING=y
CONFIG_NET_L2_IEEE802154=y
CONFIG_NET_L2_IEEE802154_SHELL=y
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=n
CONFIG_NET_UDP=n
CONFIG_NET_TCP=n
CONFIG_LOG=y
# ponytail: SAMR21 has no TRNG driver; CSMA backoff only needs a non-crypto RNG.
# Seed from AT86RF233 RSSI noise (or a real entropy source) before any security use.
CONFIG_TEST_RANDOM_GENERATOR=y
